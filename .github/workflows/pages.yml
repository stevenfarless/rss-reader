name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # A broken commit must never reach production: syntax-check every
      # script and run the tests before anything is uploaded.
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check markdown.js
      - name: Run tests
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Only the site files ship: tests, package.json, and the workflow
      # definitions are not part of the public site.
      - name: Stage site files
        run: |
          mkdir -p dist
          cp index.html app.js styles.css sw.js manifest.webmanifest markdown.js purify.min.js .nojekyll dist/
          cp -r assets fonts licenses dist/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
