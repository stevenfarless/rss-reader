name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # A broken commit must never reach production: syntax-check every
      # script and run the tests before anything is uploaded.
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check markdown.js
          node --check utils.js
          node --check pwa-install.js
      - name: Run tests
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Only the site files ship: tests, package.json, and the workflow
      # definitions are not part of the public site. Every script the
      # page loads must be listed here, or the live site 404s on it.
      - name: Stage site files
        run: |
          mkdir -p dist
          cp index.html app.js styles.css sw.js manifest.webmanifest markdown.js purify.min.js utils.js readability.js pwa-install.js .nojekyll dist/
          cp -r assets fonts licenses dist/
      # Guard against a missing staged file: every local script and
      # stylesheet index.html loads must exist in dist/, or the build
      # fails here instead of shipping a broken site.
      - name: Verify staged files
        run: |
          for f in $(grep -oE '(src|href)="[^"]+"' index.html | cut -d'"' -f2 | grep -v '^#' | grep -v '^https\?://'); do
            f="${f#./}"
            if [ ! -e "dist/$f" ]; then echo "MISSING from dist: $f"; exit 1; fi
          done
          echo "All referenced files are staged."
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
